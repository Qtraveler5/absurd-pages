<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<title>Somera_Studio — ABSURD PAGES</title>
<style>
  :root {
    --bg: #0a0a0a;
    --fg: #f2f2f2;
    --dim: #6b6b6b;
    --accent: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    position: relative;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* subtle vignette / grain feel */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  header {
    position: absolute;
    top: 0;
    left: 0;
    padding: 18px 20px;
    display: flex;
    align-items: baseline;
    gap: 10px;
    z-index: 5;
  }

  .brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--fg);
  }

  .brand .underscore {
    color: var(--dim);
    animation: blink 1.15s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .sub {
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 2;
  }

  #surprise {
    position: relative;
    appearance: none;
    border: 1.5px solid rgba(255,255,255,0.85);
    background: transparent;
    color: var(--fg);
    font-family: inherit;
    font-size: clamp(17px, 5.2vw, 22px);
    letter-spacing: 0.06em;
    padding: 22px 42px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.25s ease;
    box-shadow: 0 0 0 rgba(255,255,255,0);
    overflow: hidden;
  }

  #surprise:active {
    transform: scale(0.94);
    background: rgba(255,255,255,0.08);
  }

  @media (hover: hover) {
    #surprise:hover {
      background: #fff;
      color: #0a0a0a;
      box-shadow: 0 0 40px rgba(255,255,255,0.25);
    }
  }

  #surprise.loading {
    pointer-events: none;
    opacity: 0.55;
    animation: pulse 0.5s ease infinite alternate;
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to   { transform: scale(0.96); }
  }

  footer {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 16px 20px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: var(--dim);
    text-transform: uppercase;
    z-index: 5;
  }

  #counter {
    opacity: 0.7;
  }

  /* little pop of the last chosen title */
  #toast {
    position: absolute;
    left: 50%;
    bottom: 64px;
    transform: translate(-50%, 12px);
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--dim);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    text-align: center;
    max-width: 80vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  /* flash on selection */
  .flash {
    animation: flash 0.35s ease;
  }

  @keyframes flash {
    0%   { background: #0a0a0a; }
    20%  { background: #1a1a1a; }
    100% { background: #0a0a0a; }
  }
</style>
</head>
<body>

  <header>
    <span class="brand">Somera<span class="underscore">_</span>Studio</span>
    <span class="sub">Absurd Pages</span>
  </header>

  <main>
    <button id="surprise" aria-label="Open a random absurd page">Suprise me!</button>
  </main>

  <div id="toast"></div>

  <footer>
    <span id="counter">0 / 43</span>
    <span>tap at your own risk</span>
  </footer>

<script>
  const PAGES = [
    { t: "Digital Trip",              u: "https://htdt.github.io/digital_trip/" },
    { t: "Harmonics",                 u: "https://musiclab.chromeexperiments.com/Harmonics/" },
    { t: "Kim Jong Il Looking At Things", u: "https://kimjongillookingatthings.tumblr.com/" },
    { t: "Choir",                     u: "https://www.adultswim.com/etcetera/choir" },
    { t: "Elastic Man",               u: "https://www.adultswim.com/etcetera/elastic-man" },
    { t: "Quick, Draw!",              u: "https://quickdraw.withgoogle.com/" },
    { t: "Absurd Trolley Problems",   u: "https://neal.fun/absurd-trolley-problems/" },
    { t: "100,000 Stars",             u: "https://stars.chromeexperiments.com/" },
    { t: "Pale Blue",                 u: "https://paleblue.news/?shem=aimgspe" },
    { t: "Shape Reaction",            u: "https://retryables.com/shape-reaction/?shem=aimgspe" },
    { t: "Pug in a Rug",              u: "https://puginarug.com/?shem=aimgspe" },
    { t: "Perfect Circle",            u: "https://neal.fun/perfect-circle/?shem=aimgspe" },
    { t: "Sleep Animal",              u: "https://vole.wtf/sleep-animal/?shem=aimgspe" },
    { t: "Bouncy Balls",              u: "https://bouncyballs.org/?shem=aimgspe" },
    { t: "Rotating Sandwiches",       u: "https://rotatingsandwiches.com/?shem=aimgspe" },
    { t: "Cat Trap",                  u: "https://llerrah.com/cattrap.htm?shem=aimgspe" },
    { t: "Broken Self",               u: "https://www.brokenself.com/?shem=aimgspe" },
    { t: "Spectrogram",               u: "https://musiclab.chromeexperiments.com/Spectrogram/?shem=aimgspe" },
    { t: "InspiroBot",                u: "https://inspirobot.me/?shem=aimgspe" },
    { t: "Zoomquilt 2",               u: "https://zoomquilt2.com/?shem=aimgspe" },
    { t: "Rainy Mood",                u: "https://www.rainymood.com/?shem=aimgspe" },
    { t: "Blank Windows",             u: "https://blankwindows.com/?shem=aimgspe" },
    { t: "2020 Game",                 u: "https://2020game.io/?shem=aimgspe" },
    { t: "Virtual Drumming",          u: "https://www.virtualdrumming.com/drums/drums-app-game-android-ios/drums-app-game-android-ios.html?shem=aimgspe" },
    { t: "PlayPhrase",                u: "https://www.playphrase.me/?shem=aimgspe#/search?q=Nice+to+meet+you.&pos=2&language=en" },
    { t: "Guess the Price",           u: "https://guesstheprice.net/" },
    { t: "Helen Keller Simulator",    u: "https://helenkellersimulator.org/?shem=aimgspe" },
    { t: "Bongo Cat",                 u: "https://bongo.cat/?shem=aimgspe" },
    { t: "Keys",                      u: "https://keys.playables.net/?shem=aimgspe" },
    { t: "Big Long Now",              u: "https://www.biglongnow.com/?shem=aimgspe" },
    { t: "Shit Day",                  u: "https://shitday.de/?shem=aimgspe" },
    { t: "The True Size Of",          u: "https://thetruesize.com/?shem=aimgspe#?borders=1~!MTYyNzAxNDA.MTUzMDc0Mg*MjYyOTI0MzY(MTMxMDg4NDI~!CONTIGUOUS_US*MTAwMjQwNzU.MjUwMjM1MTc(MTc1)MQ~!IN*NTI2NDA1MQ.Nzg2MzQyMQ)Mg~!CN*OTkyMTY5Nw.NzMxNDcwNQ(MjI1)Mw" },
    { t: "Random Colour",             u: "https://randomcolour.com/" },
    { t: "Iceberger",                 u: "https://joshdata.me/iceberger.html" },
    { t: "Eutow",                     u: "https://demo.marpi.pl/archan/eutow/" },
    { t: "White Trash",               u: "https://whitetrash.nl/" },
    { t: "Trip to Mars",              u: "https://absurd.website/trip-to-mars/" },
    { t: "Tree.fm",                   u: "https://tree.fm/forest/40" },
    { t: "Nate Judge",                u: "https://www.natejudge.com/" },
    { t: "Arpeggios",                 u: "https://musiclab.chromeexperiments.com/Arpeggios/" },
    { t: "Yes No If",                 u: "https://yesnoif.com/" },
    { t: "7 Billion World",           u: "https://www.7billionworld.com/" },
    { t: "Self-Contained Glyphs",     u: "https://www.madsci.org/cgi-bin/lynn/jardin/SCG" }
  ];

  const btn     = document.getElementById('surprise');
  const toast   = document.getElementById('toast');
  const counter = document.getElementById('counter');

  const seen = new Set();

  function updateCounter() {
    counter.textContent = seen.size + " / " + PAGES.length;
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function pickIndex() {
    // avoid immediate repeats, and prefer unseen pages
    const unseen = PAGES.map((_, i) => i).filter(i => !seen.has(i));

    if (unseen.length > 0) {
      return unseen[Math.floor(Math.random() * unseen.length)];
    }

    // all seen → reset memory, pick anything
    seen.clear();
    return Math.floor(Math.random() * PAGES.length);
  }

  function openUrl(url) {
    // Anchor-based open is the most reliable on mobile (survives popup blockers)
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  btn.addEventListener('click', () => {
    const i = pickIndex();
    const page = PAGES[i];

    seen.add(i);
    updateCounter();
    showToast("→ " + page.t);

    btn.classList.add('loading');
    document.body.classList.add('flash');

    // tiny delay so the toast/flash registers before leaving the page
    setTimeout(() => {
      openUrl(page.u);
      btn.classList.remove('loading');
      document.body.classList.remove('flash');
    }, 260);
  });

  // block pinch-zoom weirdness on iOS Safari
  document.addEventListener('gesturestart', e => e.preventDefault());

  updateCounter();
</script>
</body>
</html>
